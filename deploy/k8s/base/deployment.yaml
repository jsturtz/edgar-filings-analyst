# Keeps the API running: Kubernetes restarts crashed pods and replaces them during rollouts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgar-api
spec:
  replicas: 1
  revisionHistoryLimit: 5      # old ReplicaSets kept for `kubectl rollout undo`
  progressDeadlineSeconds: 180 # a rollout with no Ready new pod for 3 minutes is marked failed
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  # never take the old pod down before a new one is Ready
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: edgar-analyst
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: edgar-config
            - secretRef:
                name: edgar-secrets
          # startup: give the embedding model time to load before liveness checks begin
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 30
          # liveness: restart the container if the process hangs
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          # readiness: only send traffic once the index exists (503 until ingest is done)
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {memory: 2Gi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: edgar-data
