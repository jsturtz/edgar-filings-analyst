# Runs ingest once, to completion: download 10-Ks + XBRL facts, embed into Chroma, build the golden set.
apiVersion: batch/v1
kind: Job
metadata:
  name: edgar-ingest
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400  # keep the finished Job (and its logs) for a day
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ingest
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001  # makes the mounted volume writable by the app user
      containers:
        - name: ingest
          image: edgar-analyst
          command: ["sh", "-c"]
          args:
            - python -m edgar_agent.ingest $INGEST_ARGS && python eval/build_golden.py --out /data/golden.jsonl
          envFrom:
            - configMapRef:
                name: edgar-config
            - secretRef:
                name: edgar-secrets
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 3Gi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: edgar-data
